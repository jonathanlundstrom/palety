version: "2"

volumes:
    db:

services:
    app:
        build:
            context: .
        privileged: true
        expose:
            - "80"

    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: "${DB_DATABASE:?}"
            POSTGRES_USER: "${DB_USERNAME:?}"
            POSTGRES_PASSWORD: "${DB_PASSWORD:?}"
            PGDATA: "/home/postgres/pgdata/data"
            TIMESCALEDB_TELEMETRY: "off"
        ports:
            - "${DB_PORT:?}:5432"
        volumes:
            - "db:/home/postgres/pgdata/data"
